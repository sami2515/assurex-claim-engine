{% extends "components/base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 bg-white overflow-hidden">
            <div class="bg-primary text-white p-4 text-center">
                <i class="bi bi-person-plus-fill fs-1 mb-2 d-block"></i>
                <h4 class="fw-bold mb-1">Create Customer Account</h4>
                <p class="mb-0 text-white-50 small">Register your products and submit warranty claims with automated AI adjudication</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-12">
                            <label for="full_name" class="form-label fw-semibold small text-slate-700">Full Legal Name</label>
                            <input type="text" class="form-control bg-light" id="full_name" name="full_name" required placeholder="e.g. John Doe">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold small text-slate-700">Email Address</label>
                            <input type="email" class="form-control bg-light" id="email" name="email" required placeholder="john.doe@example.com">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold small text-slate-700">Phone Number</label>
                            <input type="tel" class="form-control bg-light" id="phone" name="phone" placeholder="+1-555-0199">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label fw-semibold small text-slate-700">Mailing Address</label>
                            <input type="text" class="form-control bg-light" id="address" name="address" placeholder="123 Innovation Way, Suite 400">
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold small text-slate-700">Password</label>
                            <input type="password" class="form-control bg-light" id="password" name="password" required minlength="8" placeholder="Minimum 8 characters">
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold small text-slate-700">Confirm Password</label>
                            <input type="password" class="form-control bg-light" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Repeat password">
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required checked>
                        <label class="form-check-label extra-small text-muted" for="terms">
                            I agree to the AssureX Warranty Intelligence Terms of Service, Privacy Policy, and automated fraud screening.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-person-check-fill"></i> Complete Registration
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-light-subtle">
                    <span class="text-muted small">Already registered?</span>
                    <a href="{{ url_for('auth.login') }}" class="text-primary small fw-semibold ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
